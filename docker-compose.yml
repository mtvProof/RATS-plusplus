services:
  rustplusbot:
    # Build from local code
    build:
      context: .
      dockerfile: Dockerfile
    image: mtvproof-ratspp:latest
    container_name: rustplusbot
    restart: unless-stopped
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # Override environment variables for rate limiting
    environment:
      - RPP_POLLING_INTERVAL=${RPP_POLLING_INTERVAL:-15000}  # Default 15s to prevent rate limiting
    
    # Persistent Data Volumes (bind mounts to your local directories)
    # These directories on your host are mounted into the container
    # Your data PERSISTS across container restarts and redeployments!
    volumes:
      - ./logs:/app/logs
      - ./instances:/app/instances
      - ./credentials:/app/credentials
      - ./database:/app/database
      - ./maps:/app/maps
    
    # Expose Web UI port (if enabled)
    ports:
      - "${RPP_WEBUI_PORT:-3000}:3000"
    
    # Health check to ensure bot is running
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

